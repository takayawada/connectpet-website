<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIチャット（Tayori）| Connect Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#ff8c42;--nv:#0b0e1a;--w:#fff;
  --f1:#fdf8f3;--f2:#faeee5;
  --ink:#1b2138;--ink2:#4a526a;--sil:#94a0b8;--ln:rgba(27,33,56,.08);
  --S:'Zen Kaku Gothic New',sans-serif;
  --B:'Noto Sans JP',sans-serif;
  --M:'DM Mono',monospace;
}
body{font-family:var(--B);background:var(--f1);color:var(--ink);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

nav{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--ln);padding:15px 48px;display:flex;align-items:center;justify-content:space-between}
.nav-logo img{height:22px;width:auto}
.nav-logo-fb{font-family:var(--S);font-size:14px;font-weight:700;color:var(--nv)}
.nav-logo-fb em{color:var(--or);font-style:normal}
.nav-links{display:flex;gap:20px;align-items:center}
.nav-link{font-family:var(--M);font-size:11px;letter-spacing:.14em;color:var(--sil);transition:color .2s}
.nav-link:hover{color:var(--or)}
.nav-link.active{color:var(--or);font-weight:700}

.page-head{padding:48px 48px 24px;max-width:900px;margin:0 auto;text-align:center}
.page-eyebrow{font-family:var(--M);font-size:10px;letter-spacing:.28em;color:var(--or);margin-bottom:14px}
.page-title{font-family:var(--S);font-size:clamp(24px,3.5vw,38px);font-weight:900;color:var(--ink);margin-bottom:10px}
.page-sub{font-size:13px;color:var(--sil);line-height:1.8}
.badge-tayori{display:inline-block;background:#00c4b4;color:#fff;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;margin-top:12px;letter-spacing:.06em}

.bot-wrap{max-width:800px;margin:0 auto;padding:24px 48px 96px}
.bot-info{
  background:var(--w);border-radius:16px;padding:48px;
  box-shadow:0 4px 28px rgba(27,33,56,.08);border:1px solid var(--ln);
  text-align:center;min-height:400px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.bot-info-icon{font-size:48px}
.bot-info-title{font-family:var(--S);font-size:20px;font-weight:700;color:var(--ink)}
.bot-info-text{font-size:13px;color:var(--sil);line-height:1.8;max-width:400px}

footer{background:var(--nv);padding:32px 48px;display:flex;align-items:center;justify-content:space-between}
.ft-logo img{height:18px;filter:brightness(0) invert(1);opacity:.6}
.ft-copy{font-family:var(--M);font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.1em}

@media(max-width:640px){
  nav{padding:13px 20px}
  .page-head{padding:36px 20px 20px}
  .bot-wrap{padding:16px 20px 72px}
  .bot-info{padding:32px 20px}
  footer{padding:24px 20px;flex-direction:column;gap:10px}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <img src="images/connect_pet_logo.png" alt="CONNECT PET"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="nav-logo-fb" style="display:none">CONNECT <em>PET</em></span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="/">トップ</a>
    <a class="nav-link" href="/chatbot-dify.html">Dify</a>
    <a class="nav-link active" href="/chatbot-tayori.html">Tayori</a>
  </div>
</nav>

<div class="page-head">
  <div class="page-eyebrow">AI CHATBOT</div>
  <h1 class="page-title">AIチャットボット</h1>
  <p class="page-sub">Connect Petについて、何でもお気軽にご質問ください。</p>
  <span class="badge-tayori">Tayori</span>
</div>

<div class="bot-wrap">
  <div class="bot-info">
    <div class="bot-info-icon">💬</div>
    <h2 class="bot-info-title">Tayori AIチャットボット</h2>
    <p class="bot-info-text">右下に表示されるチャットアイコンからお気軽にお問い合わせください。</p>
  </div>
</div>

<footer>
  <div class="ft-logo"><img src="images/connect_pet_logo.png" alt="CONNECT PET" onerror="this.style.display='none'"></div>
  <span class="ft-copy">&copy; CONNECT PET, Inc</span>
</footer>

<!-- Tayori AI チャットボット -->
<script>
(function(){
  var a=document.getElementsByTagName('script')[0];
  var d=document.createElement('script');
  d.type='text/javascript';
  d.async=true;
  d.src='https://ai-chatbot.tayori.com/assets/chat/index.js?key=a22ad73f-f8df-4908-8a81-5187b0bdda7c';
  a.parentNode.insertBefore(d,a);
})();
</script>

<!-- チャット自動オープン ＋ 閉じたらLINEへ遷移（クライアント提供ロジック） -->
<script>
var checkChat = setInterval(function() {
    var btn = document.querySelector('.tayori-ai-chatbot-app-tayori-ai-chatbot-icon');
    if (btn) {
        btn.click();
        clearInterval(checkChat);
        monitorChatClose();
    }
}, 500);
setTimeout(function() { clearInterval(checkChat); }, 10000);

function monitorChatClose() {
    var observer = new MutationObserver(function() {
        var chatWindow = document.querySelector('.tayori-ai-chatbot-app-tayori-ai-chatbot-icon');
        if (chatWindow && window.getComputedStyle(chatWindow).display !== 'none') {
            window.close();
            if (!window.closed) {
                location.href = 'https://line.me/R/';
            }
        }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
}
</script>

</body>
</html>
